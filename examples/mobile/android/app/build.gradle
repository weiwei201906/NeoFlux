// =============================================================================
// NeoFlux Android Example - build.gradle (app module)
//
// Configures the Android NDK build with CMake. The NeoFlux library is included
// as a subdirectory from thirdparty/neoflux.
// =============================================================================

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoflux.example'
    compileSdk 34

    defaultConfig {
        applicationId "com.neoflux.example"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
