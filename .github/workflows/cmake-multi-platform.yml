name: CMake Build (NeoFlux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 仅保留项目实际支持的平台和编译器组合
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
        # 排除无效组合（模板默认的，我们不需要）
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # 为 Ubuntu 安装较新版本的 GCC（项目要求 GCC 11+）
      - name: Install GCC 11 on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          echo "CC=gcc-11" >> $GITHUB_ENV
          echo "CXX=g++-11" >> $GITHUB_ENV

      # 确保 Python 3 可用（Ubuntu 默认有 python3，但可能需要 python 命令）
      - name: Ensure Python 3 is available
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y python3 python-is-python3

      # 设置常用输出变量
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> $GITHUB_OUTPUT

      # 第一次配置 CMake（可能因 shaderc 依赖同步失败而报错）
      - name: Configure CMake (first attempt)
        id: configure_first
        continue-on-error: true   # 即使失败也不终止 job
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      # 如果第一次配置失败（因 shaderc 问题），手动同步依赖
      - name: Sync shaderc dependencies manually
        if: steps.configure_first.outcome == 'failure'
        working-directory: ${{ steps.strings.outputs.build-output-dir }}/_deps/tgfx-src
        run: |
          python3 third_party/shaderc/utils/git-sync-deps

      # 第二次配置 CMake（此时依赖已存在，应该成功）
      - name: Configure CMake (second attempt)
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      # 构建（使用所有 CPU 核心并行编译）
      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j $(nproc)

      # 运行测试（如果项目有测试）
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure