name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 22.04)
            os: ubuntu-22.04
            cmake-generator: "Unix Makefiles"
          - name: Windows (MSVC)
            os: windows-2022
            cmake-generator: "Ninja"
          - name: macOS (AppleClang)
            os: macos-14
            cmake-generator: "Ninja"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      # Cache the checked-out submodules. These are the bulk of the clone
      # cost, and their revisions are pinned by .gitmodules, so the cache key
      # only needs to change when the pins do.
      - name: Cache submodules
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      - name: Init submodules
        shell: bash
        run: bash scripts/bootstrap.sh

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            libmpv-dev libgl1-mesa-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxi-dev libglu1-mesa-dev \
            libwayland-bin wayland-protocols libwayland-dev \
            libxkbcommon-dev \
            xvfb

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install ninja mpv

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G "${{ matrix.cmake-generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEOFLUX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j 2

      - name: Test (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: |
          cd build
          xvfb-run -a ctest --output-on-failure

      - name: Test (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          cd build
          ctest --output-on-failure

  clang-tidy:
    name: clang-tidy (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Cache submodules
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: submodules-Linux-${{ hashFiles('.gitmodules') }}

      - name: Init submodules
        run: bash scripts/bootstrap.sh

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libmpv-dev libgl1-mesa-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-bin wayland-protocols libwayland-dev libxkbcommon-dev \
            clang-tidy python3-pip

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEOFLUX_BUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on neoflux source
        run: |
          run-clang-tidy -p build -j"$(nproc)" \
            -header-filter='(neoflux/include/neoflux|neoflux/src|src)/.*' \
            -quiet \
            -extra-arg-before=-Wno-unknown-warning-option \
            '^(?!.*thirdparty/).*(/neoflux/src/|/src/)' 2>&1 | tee clang-tidy.log
          if grep -qE 'error:' clang-tidy.log; then
            echo "::error::clang-tidy reported errors"
            grep -E 'error:' clang-tidy.log | head -30
            exit 1
          fi
          echo "clang-tidy: no errors"

      - name: Enforce ASCII-only source
        run: |
          violations=$(grep -rPn '[^\x00-\x7F]' \
            --include='*.h' --include='*.cpp' --include='*.hpp' \
            neoflux/include neoflux/src src 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "::error::Non-ASCII characters found in source:"
            echo "$violations"
            exit 1
          fi
