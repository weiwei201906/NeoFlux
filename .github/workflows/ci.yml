name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 22.04)
            os: ubuntu-22.04
            cmake-generator: "Unix Makefiles"
          - name: Windows (MSVC)
            os: windows-2022
            cmake-generator: "Ninja"
          - name: macOS (AppleClang)
            os: macos-14
            cmake-generator: "Ninja"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      # Cache the checked-out submodules. These are the bulk of the clone
      # cost, and their revisions are pinned by .gitmodules, so the cache key
      # only needs to change when the pins do.
      - name: Cache submodules
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: submodules-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      - name: Init submodules
        shell: bash
        run: bash scripts/bootstrap.sh

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git \
            libmpv-dev libgl1-mesa-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxi-dev libglu1-mesa-dev \
            libwayland-bin wayland-protocols libwayland-dev \
            libxkbcommon-dev \
            xvfb

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install ninja mpv

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G "${{ matrix.cmake-generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEOFLUX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j 2

      - name: Test (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: |
          cd build
          xvfb-run -a ctest --output-on-failure

      - name: Test (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          cd build
          ctest --output-on-failure

  clang-tidy:
    name: clang-tidy (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Cache submodules
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: submodules-Linux-${{ hashFiles('.gitmodules') }}

      - name: Init submodules
        run: bash scripts/bootstrap.sh

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libmpv-dev libgl1-mesa-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-bin wayland-protocols libwayland-dev libxkbcommon-dev \
            clang-tidy python3-pip

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEOFLUX_BUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on neoflux source
        run: |
          run-clang-tidy -p build -j"$(nproc)" \
            -header-filter='neoflux/.*' \
            -quiet \
            -extra-arg-before=-Wno-unknown-warning-option \
            '.*/neoflux/.*' 2>&1 | tee clang-tidy.log
          if grep -qE '(warning:|error:)' clang-tidy.log; then
            echo "::error::clang-tidy reported warnings or errors"
            grep -E '(warning:|error:)' clang-tidy.log | head -30
            exit 1
          fi
          echo "clang-tidy: no warnings or errors"

      # Assembly is part of the source tree and is easy to overlook: a .S file
      # that picks up a non-ASCII dash in a comment would otherwise ship
      # unnoticed, and some assemblers choke on non-ASCII bytes. Cover every
      # compiled extension, including the standalone verify/ suite.
      - name: Enforce ASCII-only source
        run: |
          violations=$(grep -rPn '[^\x00-\x7F]' \
            --include='*.h' --include='*.hpp' --include='*.c' --include='*.cc' \
            --include='*.cpp' --include='*.S' --include='*.asm' \
            neoflux/include neoflux/src verify 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "::error::Non-ASCII characters found in source:"
            echo "$violations"
            exit 1
          fi

  policy:
    name: Policy gates (Linux)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Project rule: C++ never contains inline asm. Every hand-written
      # routine is a standalone .S under src/native/asm reached through the C
      # ABI, which is what keeps the kernels independent of any one
      # compiler's inline-asm or intrinsic model.
      #
      # Line comments are stripped before matching: the rule is documented in
      # comments that necessarily spell out the very tokens being banned
      # (see src/native/windows/platform_win32.cpp), and matching those would
      # make the gate reject the code that explains it.
      - name: No inline asm in C++ sources
        run: |
          status=0
          for f in $(find neoflux/include neoflux/src verify \
                       -name '*.h' -o -name '*.hpp' -o -name '*.cpp'); do
            bad=$(sed 's|//.*||' "$f" \
              | grep -nP '\b__asm__\b|\b__asm\b|\basm\s+volatile\b' || true)
            if [ -n "$bad" ]; then
              echo "::error::inline asm in $f; move it to src/native/asm:"
              echo "$bad"
              status=1
            fi
          done
          exit $status

      # Business, render-pipeline and scheduling code must never include an
      # intrinsic header. Two trees are exempt and both are deliberate:
      #   src/native/  the platform / dispatch / feature-detect layer, which
      #                is exactly where an intrinsic is allowed to land
      #   tests, verify/  correctness regression and asm cross-checks only,
      #                never part of a shipped binary
      - name: No intrinsic headers outside the platform layer and tests
        run: |
          status=0
          matches=()
          for f in $(find neoflux/include neoflux/src verify \
                       -name '*.h' -o -name '*.hpp' -o -name '*.cpp'); do
            hit=$(sed 's|//.*||' "$f" \
              | grep -nP '#\s*include\s*<(immintrin|arm_neon|xmmintrin|emmintrin|pmmintrin|tmmintrin|smmintrin|nmmintrin|wmmintrin|avxintrin|avx2intrin|intrin)\.h>' || true)
            if [ -n "$hit" ]; then
              # One array element per match. The previous revision accumulated
              # these into a string with an embedded newline inside a quoted
              # command substitution, which needed a closing quote at column
              # zero - and that column-zero quote ended this YAML block scalar
              # early, leaving the workflow file unparseable.
              while IFS= read -r line; do
                matches+=("$f:$line")
              done <<< "$hit"
            fi
          done
          violations=""
          for match in "${matches[@]}"; do
            case "$match" in
              */native/*|*/tests/*|verify/*) ;;
              *) violations="$violations$match"$'\n' ;;
            esac
          done
          if [ -n "$violations" ]; then
            echo "::error::intrinsic header outside src/native/, tests/ and verify/:"
            echo "$violations"
            status=1
          fi
          exit $status

      # Two things, both cheap and both catching failures that are otherwise
      # only visible on one platform:
      #   1. every .S exports a neoflux_-prefixed symbol that is actually
      #      declared in asm_symbols.h (an unregistered .S is invisible to
      #      reviewers and can silently never be linked)
      #   2. register discipline -- the classic "passes on Linux, corrupts
      #      the caller on Windows" bug:
      #        Win64:   xmm6-xmm15 are callee-saved  -> x86-64 kernels may
      #                 only touch xmm0-xmm5
      #        AAPCS64: v8-v15 low 64 bits are callee-saved -> AArch64
      #                 kernels may only touch v0-v7 and v16-v31
      #      Comments are stripped first so the prose describing the rule
      #      does not trip the very check that enforces it.
      - name: Hand-written assembly follows the ABI contract
        run: |
          status=0
          for f in neoflux/src/native/asm/*.S; do
            [ -e "$f" ] || continue
            body=$(sed 's|//.*||; s/#.*//' "$f")

            sym=$(printf '%s\n' "$body" | grep -oE 'neoflux_[a-z0-9_]+' | head -1)
            if [ -z "$sym" ]; then
              echo "::error::$f exports no neoflux_-prefixed symbol"
              status=1
              continue
            fi
            if ! grep -q "$sym" neoflux/src/native/asm/asm_symbols.h; then
              echo "::error::$f exports $sym but asm_symbols.h does not declare it"
              status=1
            fi

            case "$f" in
              *_x86_64.S)
                bad=$(printf '%s\n' "$body" \
                  | grep -nE '%?xmm(6|7|8|9|1[0-5])\b' || true)
                if [ -n "$bad" ]; then
                  echo "::error::$f touches a Win64 callee-saved xmm register:"
                  echo "$bad"
                  status=1
                fi
                ;;
              *_aarch64.S)
                bad=$(printf '%s\n' "$body" \
                  | grep -nE '\bv(8|9|1[0-5])\b' || true)
                if [ -n "$bad" ]; then
                  echo "::error::$f touches an AAPCS64 callee-saved v register:"
                  echo "$bad"
                  status=1
                fi
                ;;
            esac
          done
          exit $status
